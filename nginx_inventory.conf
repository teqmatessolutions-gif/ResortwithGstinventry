server {
    server_name www.teqmates.com teqmates.com;
    client_max_body_size 50M;

    # 1. Landing Page (Root)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. User App (Frontend) - /pomma
    location /pomma {
        alias /var/www/pomma;
        index index.html;
        try_files $uri $uri/ /pomma/index.html;
    }

    # 3. Dashboard (Admin) - /pommaadmin
    location /pommaadmin {
        alias /var/www/pommaadmin;
        index index.html;
        try_files $uri $uri/ /pommaadmin/index.html;
    }

    # 4. Inventory App (NEW) - /inventory
    location /inventory {
        alias /var/www/inventory/build;
        index index.html;
        try_files $uri $uri/ /inventory/index.html;
    }

    # 5. Backend API (Original) - Port 8000
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Inventory API (NEW) - Port 8011
    # Frontend calls /inventoryapi/api/... which proxies to localhost:8011/api/...
    location /inventoryapi/ {
        rewrite ^/inventoryapi/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Docs
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Handle uploads access via /pomma/uploads/
    location ^~ /pomma/uploads/ {
        alias /opt/pomma/ResortApp/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serving Uploaded Files directly via Nginx
    location /uploads/ {
        alias /opt/pomma/ResortApp/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Inventory Uploads
    location /inventory/uploads/ {
        alias /var/www/inventory/ResortApp/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fix for frontend expecting /pommaapi path
    location /pommaapi/ {
        rewrite ^/pommaapi/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/teqmates.com/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/teqmates.com/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

server {
    if ($host = www.teqmates.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = teqmates.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name www.teqmates.com teqmates.com;
    return 404;
}
